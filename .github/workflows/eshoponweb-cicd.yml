name: eShopOnWeb Build and Test

on:
  workflow_dispatch:

env:
  RESOURCE_GROUP: rg-eshoponweb-eastus2
  LOCATION: eastus2
  TEMPLATE_FILE: infra/webapp.bicep
  SUBSCRIPTION_ID: 5bf60399-6fb9-43a1-bc9e-6ae63033c9bf
  WEBAPP_NAME: devops-webapp-eastus2-59319020
  # Opcional: si sospechas de nombre en uso, habilita esta línea y úsala en params:
  # UNIQUE_SUFFIX: ${{ github.run_id }}

jobs:
  buildandtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
          dotnet-quality: "preview"

      - name: Build with dotnet
        run: dotnet build ./eShopOnWeb.sln --configuration Release

      - name: Test with dotnet
        run: dotnet test ./eShopOnWeb.sln --configuration Release

      - name: dotnet publish
        run: |
          dotnet publish ./src/Web/Web.csproj -c Release -o ${{ env.DOTNET_ROOT }}/myapp
          cd ${{ env.DOTNET_ROOT }}/myapp
          zip -r ../app.zip .

      - name: Upload artifact (app)
        uses: actions/upload-artifact@v5
        with:
          name: dotnet-app
          path: ${{ env.DOTNET_ROOT }}/app.zip

      - name: Upload artifact (bicep)
        uses: actions/upload-artifact@v5
        with:
          name: bicep-template
          path: ${{ env.TEMPLATE_FILE }}

  deploy:
    runs-on: ubuntu-latest
    needs: buildandtest
    environment:
      name: Development
    steps:
      - name: Download artifact (app)
        uses: actions/download-artifact@v6
        with:
          name: dotnet-app
          path: dotnet-app

      - name: Download artifact (bicep)
        uses: actions/download-artifact@v6
        with:
          name: bicep-template
          path: bicep-template

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Validación (opcional pero recomendado)
      - name: Validate (ARM)
        uses: azure/arm-deploy@v2
        with:
          subscriptionId: ${{ env.SUBSCRIPTION_ID }}
          resourceGroupName: ${{ env.RESOURCE_GROUP }}
          template: bicep-template/webapp.bicep
          parameters: >
            webAppName=${{ env.WEBAPP_NAME }}
            location=${{ env.LOCATION }}
            # Si tu bicep soporta sufijo único:
            # webAppName=${{ env.WEBAPP_NAME }}-${{ github.run_id }}
          deploymentMode: Validate

      # What-if (opcional para ver cambios)
      - name: What-If (ARM)
        uses: azure/arm-deploy@v2
        with:
          subscriptionId: ${{ env.SUBSCRIPTION_ID }}
          resourceGroupName: ${{ env.RESOURCE_GROUP }}
          template: bicep-template/webapp.bicep
          parameters: >
            webAppName=${{ env.WEBAPP_NAME }}
            location=${{ env.LOCATION }}
          additionalArguments: --what-if

      # Deploy
      - name: Deploy (ARM)
        uses: azure/arm-deploy@v2
        with:
          subscriptionId: ${{ env.SUBSCRIPTION_ID }}
          resourceGroupName: ${{ env.RESOURCE_GROUP }}
          template: bicep-template/webapp.bicep
          parameters: >
            webAppName=${{ env.WEBAPP_NAME }}
            location=${{ env.LOCATION }}
          failOnStdErr: false
          deploymentName: webapp

      # Publicar ZIP en el WebApp
      - name: Publish Website to WebApp (CLI)
        uses: Azure/cli@v2
        with:
          inlineScript: |
            az webapp deploy \
              --name ${{ env.WEBAPP_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --src-path dotnet-app/app.zip \
              --type zip
